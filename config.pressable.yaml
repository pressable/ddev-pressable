#ddev-generated
# Pressable provider config overlay. DDEV merges every config.*.yaml into the
# project config. This adds a post-import-db hook that rewrites production URLs
# to the local DDEV URL after `ddev pull pressable`, so the local site does not
# render with production URLs. Uses `wp search-replace` (serialized-data safe) —
# never sed.
#
# To customize, copy this file and remove the `#ddev-generated` line above so a
# later `ddev add-on get` will not overwrite your changes.
hooks:
  post-import-db:
    - exec: |
        set -eu -o pipefail
        # DDEV always populates DDEV_PRIMARY_URL, but guard anyway: a
        # set-but-empty value slips past `set -u` and would turn the rewrites
        # below into `wp search-replace "$OLD" ""`, blanking every production
        # URL across all tables. Refuse rather than corrupt.
        [ -n "${DDEV_PRIMARY_URL:-}" ] || { echo "post-import-db: DDEV_PRIMARY_URL is empty; refusing to rewrite URLs." >&2; exit 1; }

        PREFIX=$(wp db prefix)
        # Read siteurl/home straight from the options table, NOT via
        # `wp option get`. DDEV's wp-config-ddev.php defines the WP_HOME /
        # WP_SITEURL constants, so get_option() (and therefore `wp option get`)
        # returns the local DDEV URL and masks the production value the import
        # just wrote. The raw row is the only source that still shows the URL we
        # need to replace: via `wp option get`, OLD would always equal the local
        # URL, the guard would always be false, and the rewrite would silently
        # never run — leaving the DB pointed at production (the original bug).
        # --batch --skip-column-names: raw, header-less output with no ASCII
        # borders (siteurl/home are plain URLs, nothing batch-mode escapes).
        raw_option() {
          wp db query "SELECT option_value FROM ${PREFIX}options WHERE option_name = '$1'" --batch --skip-column-names
        }
        # Rewrite one URL everywhere: the plain form, then the JSON-escaped-slash
        # form ("https:\/\/host"). search-replace walks PHP-serialized data but
        # treats JSON option values (nf_active_promotions, block markup, ...) as
        # opaque strings, so the escaped form needs its own pass.
        replace_url() {
          local from=$1 to=$2 from_esc to_esc
          if [ -z "$from" ] || [ "$from" = "$to" ]; then return 0; fi
          wp search-replace "$from" "$to" --all-tables-with-prefix --skip-columns=guid
          from_esc=${from//\//\\/}
          to_esc=${to//\//\\/}
          if [ "$from_esc" != "$from" ]; then
            wp search-replace "$from_esc" "$to_esc" --all-tables-with-prefix --skip-columns=guid
          fi
        }

        OLD_HOME=$(raw_option home)
        OLD_SITEURL=$(raw_option siteurl)
        # Local targets. home -> the DDEV URL. siteurl keeps whatever subdirectory
        # the remote siteurl had under home, so a "WordPress in its own directory"
        # split install (siteurl = home + /subdir, e.g. /wp) is preserved locally
        # instead of being flattened onto home — which is what lets `ddev push`
        # reverse it later. When home == siteurl this is just the DDEV URL, i.e.
        # the common single-URL case.
        NEW_HOME=$DDEV_PRIMARY_URL
        NEW_SITEURL=$DDEV_PRIMARY_URL
        # Preserve a subdirectory only when siteurl is home + "/subpath" at a real
        # path boundary. Normalize a trailing slash on home, and require the suffix
        # to start with "/", so a sibling host (https://example.com.evil/...) or a
        # bare-prefix match is never mistaken for a subdir. Any other shape (equal,
        # sibling, reverse, or empty home) collapses both bases onto the DDEV URL.
        HOME_BASE=${OLD_HOME%/}
        case "$OLD_SITEURL" in
          "$HOME_BASE"/*) NEW_SITEURL="$DDEV_PRIMARY_URL/${OLD_SITEURL#"$HOME_BASE"/}" ;;
        esac
        # Rewrite the more-specific (longer) URL first so the shorter base cannot
        # clobber the prefix of the longer one. When home == siteurl the second
        # call is a guarded no-op (its row was already rewritten) — idempotent.
        if [ ${#OLD_SITEURL} -ge ${#OLD_HOME} ]; then
          replace_url "$OLD_SITEURL" "$NEW_SITEURL"
          replace_url "$OLD_HOME" "$NEW_HOME"
        else
          replace_url "$OLD_HOME" "$NEW_HOME"
          replace_url "$OLD_SITEURL" "$NEW_SITEURL"
        fi
