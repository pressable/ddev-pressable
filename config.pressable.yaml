#ddev-generated
# Pressable provider config overlay. DDEV merges every config.*.yaml into the
# project config. This adds a post-import-db hook that rewrites production URLs
# to the local DDEV URL after `ddev pull pressable`, so the local site does not
# render with production URLs. Uses `wp search-replace` (serialized-data safe) —
# never sed.
#
# To customize, copy this file and remove the `#ddev-generated` line above so a
# later `ddev add-on get` will not overwrite your changes.
hooks:
  post-import-db:
    - exec: |
        set -eu -o pipefail
        # DDEV always populates DDEV_PRIMARY_URL, but guard anyway: a
        # set-but-empty value slips past `set -u`, and the guard below
        # ("$OLD" != "") would then run `wp search-replace "$OLD" ""`, blanking
        # every production URL across all tables. Refuse rather than corrupt.
        [ -n "${DDEV_PRIMARY_URL:-}" ] || { echo "post-import-db: DDEV_PRIMARY_URL is empty; refusing to rewrite URLs." >&2; exit 1; }
        # Read siteurl/home straight from the options table, NOT via
        # `wp option get`. DDEV's wp-config-ddev.php defines the WP_HOME /
        # WP_SITEURL constants, so get_option() (and therefore `wp option get`)
        # returns DDEV_PRIMARY_URL and masks the production value the import
        # just wrote. The raw row is the only source that still shows the URL
        # we need to replace: with `wp option get`, OLD always equals
        # DDEV_PRIMARY_URL, so the guard below is always false and the rewrite
        # silently never runs, leaving the DB pointed at production.
        #
        # Rewrite both siteurl and home: on a split install (home != siteurl)
        # rewriting only siteurl would leave production URLs behind. When they
        # are equal, the first pass already rewrote home in the DB, so the
        # second iteration reads DDEV_PRIMARY_URL and is skipped — idempotent
        # either way.
        PREFIX=$(wp db prefix)
        for opt in siteurl home; do
          # --batch --skip-column-names: raw, tab-separated, header-less output
          # (no interactive ASCII-table borders); safe here since siteurl/home
          # are plain URLs with no chars batch-mode would escape.
          OLD=$(wp db query "SELECT option_value FROM ${PREFIX}options WHERE option_name = '$opt'" --batch --skip-column-names)
          if [ -n "$OLD" ] && [ "$OLD" != "$DDEV_PRIMARY_URL" ]; then
            wp search-replace "$OLD" "$DDEV_PRIMARY_URL" --all-tables-with-prefix --skip-columns=guid
            # search-replace unserializes PHP-serialized data but treats JSON
            # option values as opaque strings, so values that store escaped
            # slashes (e.g. "https:\/\/host" in nf_active_promotions, block
            # markup, etc.) survive the pass above. Rewrite the escaped form too
            # so JSON-encoded settings are localized as well.
            OLD_ESC=${OLD//\//\\/}
            NEW_ESC=${DDEV_PRIMARY_URL//\//\\/}
            if [ "$OLD_ESC" != "$OLD" ]; then
              wp search-replace "$OLD_ESC" "$NEW_ESC" --all-tables-with-prefix --skip-columns=guid
            fi
          fi
        done
